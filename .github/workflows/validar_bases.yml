name: Validar integridade das bases PROFGEO
on:
  push:
    paths:
      - "validar_bases.py"
      - "app.py"
      - "academico.py"
      - "teste_academico.py"
      - "extrair_capes_2024.py"
      - "extrair_inep_2024.py"
      - "ranking_regic.py"
      - "teste_cenario_seis.py"
      - "regic_municipios_2018.csv"
      - "indice_municipios_profgeo.csv"
      - "rede_existente_18_polos.csv"
      - "candidatos_exemplo.csv"
      - ".github/workflows/validar_bases.yml"
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências para validação acadêmica
        run: pip install pandas
      - name: Compilar arquivos Python e detectar erros de sintaxe
        run: python -m py_compile app.py engine.py ranking_regic.py academico.py extrair_capes_2024.py extrair_inep_2024.py validar_bases.py teste_cenario_seis.py teste_academico.py
      - name: Verificar bases oficiais e cenário demonstrativo
        run: python validar_bases.py
      - name: Testar o ranking das seis localidades
        run: python teste_cenario_seis.py
      - name: Testar vínculos institucionais INEP e CAPES
        run: python -m unittest teste_academico.py -v
