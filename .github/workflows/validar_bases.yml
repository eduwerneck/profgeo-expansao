name: Validar integridade das bases PROFGEO
on:
  push:
    paths:
      - "validar_bases.py"
      - "regic_municipios_2018.csv"
      - "indice_municipios_profgeo.csv"
      - "rede_existente_18_polos.csv"
      - "candidatos_exemplo.csv"
      - ".github/workflows/validar_bases.yml"
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar bases oficiais e cenário demonstrativo
        run: python validar_bases.py
