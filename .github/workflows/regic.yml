name: Integrar REGIC 2018
on:
  workflow_dispatch:
jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar leitor Excel
        run: pip install openpyxl
      - name: Baixar e validar a REGIC municipal
        run: python preparar_regic.py
      - name: Publicar tabela normalizada
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add regic_municipios_2018.csv
          git diff --cached --quiet || (git commit -m "Integrar REGIC municipal 2018" && git push)
