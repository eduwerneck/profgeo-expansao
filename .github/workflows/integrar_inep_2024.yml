name: Integrar INEP Geografia 2024
on:
  workflow_dispatch:
  push:
    paths:
      - "extrair_inep_2024.py"
      - ".github/workflows/integrar_inep_2024.yml"
jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Extrair apenas cursos de Geografia dos microdados INEP 2024
        run: |
          set +e
          python -u extrair_inep_2024.py > inep_processamento.log 2>&1
          resultado=$?
          cat inep_processamento.log
          echo "STATUS_EXIT_CODE=$resultado" >> inep_processamento.log
          exit "$resultado"
      - name: Registrar diagnóstico e indicadores INEP
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f inep_processamento.log ]; then git add inep_processamento.log; fi
          if [ -f inep_geografia_2024.csv ]; then git add inep_geografia_2024.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "Registrar resultado extração INEP 2024"
            git pull --rebase origin main
            git push
          fi
