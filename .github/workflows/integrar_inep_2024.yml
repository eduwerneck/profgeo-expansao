name: Integrar INEP Geografia 2024
on:
  workflow_dispatch:
  push:
    paths:
      - "extrair_inep_2024.py"
      - ".github/workflows/integrar_inep_2024.yml"
jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Extrair apenas cursos de Geografia dos microdados INEP 2024
        run: python extrair_inep_2024.py
      - name: Versionar apenas indicadores Geografia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inep_geografia_2024.csv
          if ! git diff --cached --quiet; then
            git commit -m "Gerar cursos de Geografia INEP 2024"
            git push
          fi
