name: Integrar INEP Geografia 2024 - arquivo validado
on:
  workflow_dispatch:
jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests certifi
      - name: Obter arquivo oficial enviado à versão de fontes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download fontes-2024 --repo "$GITHUB_REPOSITORY" --pattern "microdados_censo_da_educacao_superior_2024.zip" --dir .
          mv "microdados_censo_da_educacao_superior_2024.zip" "inep_censo_superior_2024_fonte.zip"
          ls -lh "inep_censo_superior_2024_fonte.zip"
      - name: Extrair e filtrar dados de Geografia
        run: |
          set +e
          python -u extrair_inep_2024.py > inep_processamento.log 2>&1
          resultado=$?
          cat inep_processamento.log
          echo "STATUS_EXIT_CODE=$resultado" >> inep_processamento.log
          exit "$resultado"
      - name: Registrar diagnóstico e tabela filtrada
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f inep_processamento.log ]; then git add inep_processamento.log; fi
          if [ -f inep_geografia_2024.csv ]; then git add inep_geografia_2024.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "Processar fonte local de INEP 2024"
            git pull --rebase origin main
            git push
          fi
