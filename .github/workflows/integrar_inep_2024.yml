name: Integrar INEP Geografia 2024 - Drive fornecido
on:
  workflow_dispatch:
  push:
    paths:
      - "extrair_inep_2024.py"
      - ".github/workflows/integrar_inep_2024.yml"
jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check pandas gdown
      - name: Obter CSV oficial de cursos já compartilhado no Drive
        run: |
          gdown --id "1ZQNOiyOmPK8zIGANYysS5ILinJ0lHbbl" --output MICRODADOS_CADASTRO_CURSOS_2024.CSV
          python - <<'PY'
          from pathlib import Path
          f = Path("MICRODADOS_CADASTRO_CURSOS_2024.CSV")
          expected = 452844981
          assert f.exists(), "Arquivo do Drive nao encontrado"
          assert f.stat().st_size == expected, f"Download incompleto: {f.stat().st_size} != {expected}"
          with f.open("rb") as fd:
              h = fd.readline()
          assert b"NO_CURSO" in h and b"CO_MUNICIPIO" in h and b"QT_MAT" in h, "Cabecalho INEP inesperado"
          print("CSV INEP 2024 validado: ",f.stat().st_size,"bytes")
          PY
      - name: Gerar indicadores de Geografia com município de oferta
        run: |
          python -u extrair_inep_2024.py --cursos MICRODADOS_CADASTRO_CURSOS_2024.CSV --ies inep_ies_2024.csv --saida inep_geografia_2024.csv | tee inep_processamento.log
      - name: Registrar saída filtrada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inep_geografia_2024.csv inep_processamento.log
          if ! git diff --cached --quiet; then
            git commit -m "Integrar extrato INEP Geografia 2024 da fonte original Drive"
            git pull --rebase origin main
            git push
          fi
