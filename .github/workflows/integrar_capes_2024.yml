name: Auditar CAPES Geografia 2024 - fonte enviada
on:
  workflow_dispatch:
jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar extrato CAPES ja publicado do arquivo original
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("capes_geografia_2024.csv")
          assert p.exists(), "Extrato CAPES nao foi publicado"
          with p.open(encoding="utf-8-sig", newline="") as f:
              dados=list(csv.DictReader(f))
          assert len(dados)==134, f"Esperados 134 cursos, encontrados {len(dados)}"
          assert all(r["ano"]=="2024" and r["area"]=="GEOGRAFIA" for r in dados)
          ativos=[r for r in dados if r["situacao"]=="EM FUNCIONAMENTO"]
          projeto=[r for r in dados if r["situacao"]=="EM PROJETO"]
          assert len(ativos)==121 and len(projeto)==13
          assert len({r["codigo_programa"] for r in dados})==80
          assert len({r["codigo_curso"] for r in dados})==134
          print("CAPES 2024 confirmada: 134 cursos, 80 programas; 121 em funcionamento, 13 em projeto")
          PY
