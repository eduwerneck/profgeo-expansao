name: Integrar CAPES Geografia 2024 - arquivo validado
on:
  workflow_dispatch:
jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl requests
      - name: Obter arquivo oficial enviado à versão de fontes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download fontes-2024 --repo "$GITHUB_REPOSITORY" --pattern "br-capes-colsucup-curso-2024-2025-12-01.xlsx" --dir .
          mv "br-capes-colsucup-curso-2024-2025-12-01.xlsx" "capes_cursos_2024_fonte.xlsx"
          ls -lh "capes_cursos_2024_fonte.xlsx"
      - name: Extrair e filtrar dados de Geografia
        run: |
          set +e
          python -u extrair_capes_2024.py > capes_processamento.log 2>&1
          resultado=$?
          cat capes_processamento.log
          echo "STATUS_EXIT_CODE=$resultado" >> capes_processamento.log
          exit "$resultado"
      - name: Registrar diagnóstico e tabela filtrada
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f capes_processamento.log ]; then git add capes_processamento.log; fi
          if [ -f capes_geografia_2024.csv ]; then git add capes_geografia_2024.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "Processar fonte local de CAPES 2024"
            git pull --rebase origin main
            git push
          fi
