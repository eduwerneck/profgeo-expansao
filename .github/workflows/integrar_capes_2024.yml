name: Integrar CAPES Geografia 2024
on:
  workflow_dispatch:
  push:
    paths:
      - "extrair_capes_2024.py"
      - ".github/workflows/integrar_capes_2024.yml"
jobs:
  extrair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl
      - name: Extrair Geografia CAPES 2024
        id: extrair
        run: |
          set +e
          python extrair_capes_2024.py > capes_processamento.log 2>&1
          resultado=$?
          cat capes_processamento.log
          echo "STATUS_EXIT_CODE=$resultado" >> capes_processamento.log
          exit "$resultado"
      - name: Registrar diagnóstico e dados filtrados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f capes_processamento.log ]; then git add capes_processamento.log; fi
          if [ -f capes_geografia_2024.csv ]; then git add capes_geografia_2024.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "Registrar resultado da extração CAPES 2024"
            git pull --rebase origin main
            git push
          fi
